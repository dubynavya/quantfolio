spring:
  application:
    name: quantfolio-backend

  profiles:
    active: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

quantfolio:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-quantfolio-32bytesmin}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  market-data:
    history-days: 260
  risk:
    risk-free-rate: 0.04
    var-confidence: 0.95
    benchmark-ticker: SPY
    volatility-alert-threshold: 0.40
    drawdown-alert-threshold: 0.25
    concentration-alert-threshold: 0.40
  alerts:
    scan-cron: "0 0 */6 * * *"
  approval:
    level1-max-notional: 10000
    level2-max-notional: 50000
    level1-max-concentration: 0.20
    level2-max-concentration: 0.40

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/quantfolio;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.quantfolio: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quantfolio}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:quantfolio}
    password: ${DATABASE_PASSWORD:quantfolio}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
