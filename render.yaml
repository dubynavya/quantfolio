services:
  - type: web
    name: quantfolio-ml-service
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    healthCheckPath: /health

  - type: web
    name: quantfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: ML_SERVICE_URL
        value: https://quantfolio-ml-service.onrender.com
      - key: JWT_SECRET
        generateValue: true
