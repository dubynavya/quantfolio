name: Keep Render services warm

# Render's free tier spins services down after ~15 minutes of inactivity, and the
# first request after that takes 30-60s to wake back up. Pinging both services
# every 10 minutes keeps them warm so the live demo feels instant.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -s --max-time 90 -o /dev/null -w "backend: %{http_code}\n" https://quantfolio-backend.onrender.com/api/auth/login -X POST -H "Content-Type: application/json" -d '{}' || true

      - name: Ping ml-service
        run: |
          curl -s --max-time 90 -o /dev/null -w "ml-service: %{http_code}\n" https://quantfolio-ml-service.onrender.com/health || true
